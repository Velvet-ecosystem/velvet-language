[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velvet-language"
version = "0.1.0"
description = "Provider-neutral language and conversation organ for the Velvet ecosystem"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-only"}
authors = [
  {name = "Velvet Ecosystem"}
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=7.4,<8; python_version < '3.9'",
  "pytest>=8,<9; python_version >= '3.9'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
